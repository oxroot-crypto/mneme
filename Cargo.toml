[package]
name = "mneme"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "嵌入型向量存储引擎,为 AI Agent 的超长期记忆层设计"
license = "Unlicense"
repository = "https://gitlab.oxroot.io/rustlib/mneme"
readme = "README.md"
keywords = ["vector", "embedding", "database", "hnsw", "memory"]
categories = ["database"]

[features]
# 默认开启 mmap(L3 起,见 docs/design/01-overview.md §5.1);关闭后段文件走
# `FileSource`(`Read + Seek`)兜底,功能不变、稍慢。
default = ["mmap"]
# 段文件 mmap 零拷贝读取(L3):引入 `memmap2`。
mmap = ["dep:memmap2"]
# f16 量化副本(L6):引入 `half`;关闭时只有 f32/i8,
# `VectorFormat::F16` 于构造期返回 `Unsupported`(FC-QUANT-ERR-001)。
quant-f16 = ["dep:half"]
# async 门面(L6):引入 `tokio` 的阻塞线程池;核心库零 tokio(设计 08 §6)。
async = ["dep:tokio"]
# fuzz 专用解析入口(L6,设计 14 §5):只服务 `fuzz/` 构建,不改变运行时行为。
fuzzing = []

[dependencies]
# 元数据与后续 DSL 序列化的基础;L0 阶段仅经 serde_json 使用,直接声明以对齐依赖白名单
# (docs/design/01-overview.md §5),避免 L4 引入时再改依赖清单。
serde = "1"
serde_json = "1"
thiserror = "2"
# L2 持久层的 CRC-32 校验(帧/文件头/payload);传递依赖极少,白名单内(docs/design/01-overview.md §5)。
crc32fast = "1"
# L3 索引层的 mmap 零拷贝读(设计 04 §11);feature `mmap` 默认开启,关闭即回退 FileSource。
memmap2 = { version = "0.9", optional = true }
# L6 f16 量化副本的 IEEE 754 half 编解码(设计 01 §5 白名单);仅 feature `quant-f16` 编译。
half = { version = "2", optional = true }
# L6 async 门面的 `spawn_blocking`(设计 08 §6);只开 `rt`,不选 runtime、不引入 async I/O。
tokio = { version = "1", optional = true, default-features = false, features = ["rt"] }

[dev-dependencies]
proptest = "1"
# 持久层测试用临时目录(白名单内,见 docs/design/01-overview.md §5)。
tempfile = "3"
# L3 起的 criterion 基准(设计 14 §4);仅 dev-dependency,不进入发布产物。
# `black_box` 自 0.6 起改由 `std::hint` 提供,bench 不再从 criterion 引入。
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "hnsw"
harness = false

[[bench]]
name = "quant"
harness = false

[profile.release]
# L0 为纯函数库,lto 收益有限;thin LTO 在跨 crate 内联与编译时间间折中,
# L2 持久层落地后按 bench 数据再调。
lto = "thin"
