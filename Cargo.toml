[package]
name = "mneme-db"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "嵌入型向量存储引擎,为 AI Agent 的超长期记忆层设计"
license = "Unlicense"
repository = "https://github.com/oxroot-crypto/mneme"
readme = "README.md"
keywords = ["vector", "embedding", "database", "hnsw", "memory"]
categories = ["database"]

# crates.io 上 `mneme` 已被占用,发布名改用 `mneme-db`;lib target 仍为 `mneme`,
# 仓内与下游的 `use mneme::` 均不需改动。
[lib]
name = "mneme"

[features]
# 默认开启 mmap(L3 起,见 docs/design/01-overview.md §5.1);关闭后段文件走
# `FileSource`(`Read + Seek`)兜底,功能不变、稍慢。
default = ["mmap"]
# 段文件 mmap 零拷贝读取(L3):引入 `memmap2`。
mmap = ["dep:memmap2"]
# f16 量化副本(L6):引入 `half`;关闭时只有 f32/i8,
# `VectorFormat::F16` 于构造期返回 `Unsupported`(FC-QUANT-ERR-001)。
quant-f16 = ["dep:half"]
# async 门面(L6):引入 `tokio` 的阻塞线程池;核心库零 tokio(设计 08 §6)。
async = ["dep:tokio"]
# fuzz 专用解析入口(L6,设计 14 §5):只服务 `fuzz/` 构建,不改变运行时行为。
fuzzing = []
# WASM/边缘目标(L12,设计 12 §3.2):关闭 mmap 与后台线程,配合
# `default-features = false` + `MemStorage` 在宿主内存文件系统上运行。
wasm = []
# 静态加密(L11,设计 11 §2):AES-256-GCM 整文件信封,引入 `aes-gcm`。
encrypt = ["dep:aes-gcm", "dep:getrandom"]
# 文本/元数据压缩(L11,设计 11 §3):内置自研 LZ4 风格 codec,零依赖。
compress = []
# 可选更强压缩(L11):引入 `zstd`。
compress-zstd = ["dep:zstd"]

[dependencies]
# 元数据与后续 DSL 序列化的基础;L0 阶段仅经 serde_json 使用,直接声明以对齐依赖白名单
# (docs/design/01-overview.md §5),避免 L4 引入时再改依赖清单。
serde = "1"
serde_json = "1"
thiserror = "2"
# L2 持久层的 CRC-32 校验(帧/文件头/payload);传递依赖极少,白名单内(docs/design/01-overview.md §5)。
crc32fast = "1"
# L3 索引层的 mmap 零拷贝读(设计 04 §11);feature `mmap` 默认开启,关闭即回退 FileSource。
memmap2 = { version = "0.9", optional = true }
# L6 f16 量化副本的 IEEE 754 half 编解码(设计 01 §5 白名单);仅 feature `quant-f16` 编译。
half = { version = "2", optional = true }
# L6 async 门面的 `spawn_blocking`(设计 08 §6);只开 `rt`,不选 runtime、不引入 async I/O。
tokio = { version = "1", optional = true, default-features = false, features = ["rt"] }
# L11 静态加密(设计 11 §2):RustCrypto AES-256-GCM;仅 feature `encrypt` 编译。
aes-gcm = { version = "0.11", optional = true, default-features = false, features = ["aes", "alloc"] }
# L11 静态加密的 nonce/密钥随机源(OS 熵;仅 feature `encrypt` 编译)。
getrandom = { version = "0.4", optional = true }
# L11 可选更强压缩(设计 11 §3):仅 feature `compress-zstd` 编译。
zstd = { version = "0.14", optional = true, default-features = false }

[dev-dependencies]
proptest = "1"
# 持久层测试用临时目录(白名单内,见 docs/design/01-overview.md §5)。
tempfile = "3"
# L3 起的 criterion 基准(设计 14 §4);仅 dev-dependency,不进入发布产物。
# `black_box` 自 0.6 起改由 `std::hint` 提供,bench 不再从 criterion 引入。
criterion = { version = "0.8", default-features = false }
# 端到端示例 examples/memory:经 OpenAI 协议调用第三方嵌入 API(设计 16 §6)。
# Rust 生态无官方 SDK,async-openai 是事实标准(活跃维护、按 OpenAI OpenAPI 生成)。
# 仅 dev-dependency,不进发布产物;显式选 rustls 后端,避免系统 OpenSSL 依赖。
async-openai = { version = "0.42", default-features = false, features = [
    "embedding",
    "rustls",
] }
# 示例的 `#[tokio::main]` 运行时(嵌入客户端是 async);库本体仍零 tokio,
# 除非开启 feature `async`(那部分只用到 `rt`)。
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "hnsw"
harness = false

[[bench]]
name = "quant"
harness = false

# 端到端示例:经 OpenAI 协议接第三方嵌入 API。显式声明 `test = true`,
# 让 `cargo test` 矩阵自动跑到示例里的离线路径用例(examples/memory/tests.rs)。
[[example]]
name = "memory"
path = "examples/memory/main.rs"
test = true

[profile.release]
# L0 为纯函数库,lto 收益有限;thin LTO 在跨 crate 内联与编译时间间折中,
# L2 持久层落地后按 bench 数据再调。`codegen-units = 1` 经 quant 基准对照
# 收益不显著(p > 0.05,查询 ±5%、建库 −2%),故保持默认以换取编译速度。
lto = "thin"
