[package]
name = "mneme"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "嵌入型向量存储引擎,为 AI Agent 的超长期记忆层设计"
license = "Unlicense"
repository = "https://gitlab.oxroot.io/rustlib/mneme"
readme = "README.md"
keywords = ["vector", "embedding", "database", "hnsw", "memory"]
categories = ["database"]

[dependencies]
serde = "1"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"
